name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Debian 12/13 containers the installer targets.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        # The suite is hermetic — no InfluxDB, no Tibber, no network — so a
        # failure here is a real one rather than a missing service.
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build
        working-directory: frontend
        # npm run build is `tsc && vite build`, so this is the type check too.
        run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: |
          for f in install.sh update.sh run.sh scripts/dynadash-admin scripts/lib-provision.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Lint with shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files are resolved at runtime, not by the linter.
          shellcheck -e SC1091 install.sh update.sh run.sh \
            scripts/dynadash-admin scripts/lib-provision.sh

  systemd:
    name: systemd unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render and verify the unit templates
        run: |
          render() {
            sed -e 's|@APP_DIR@|/opt/dynadash|g' \
                -e 's|@BACKEND_DIR@|/opt/dynadash/backend|g' \
                -e 's|@SERVICE_USER@|dynadash|g' "systemd/$1" > "/tmp/$2"
          }
          render dynadash-backend.service.in dynadash-backend.service
          render dynadash-update.service     dynadash-update.service
          render dynadash-update.path        dynadash-update.path

          # ExecStart points into a checkout that does not exist here, so only
          # directive errors matter; those are what this catches.
          for unit in dynadash-backend.service dynadash-update.service dynadash-update.path; do
            echo "--- $unit"
            output="$(systemd-analyze verify "/tmp/$unit" 2>&1 || true)"
            echo "$output"
            if echo "$output" | grep -vF 'is not executable' \
                              | grep -vF 'does not exist' \
                              | grep -qiE 'unknown|invalid|failed'; then
              echo "::error::$unit has directive errors"
              exit 1
            fi
          done

      - name: The backend must not be able to gain privileges
        run: |
          # The whole point of routing updates through the path unit is that this
          # can stay on; a regression here would silently widen the sandbox.
          grep -q '^NoNewPrivileges=yes$' systemd/dynadash-backend.service.in
          grep -q '^CapabilityBoundingSet=$' systemd/dynadash-backend.service.in
          grep -q '^ProtectSystem=strict$' systemd/dynadash-backend.service.in
          # Matches sudo as a command, not the comments explaining its absence.
          if grep -rnE "['\"]sudo['\"]" backend/ --include='*.py'; then
            echo "::error::the backend should no longer shell out to sudo"
            exit 1
          fi
          if grep -rn 'subprocess' backend/routers/update.py; then
            echo "::error::the updater should go through the path unit, not spawn processes"
            exit 1
          fi
